version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: gharse-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok ? 1 : 0 } catch(e) { 0 }' | grep -q 1"]
      interval: 10s
      timeout: 30s
      start_period: 10s
      retries: 5

  mongo-init:
    image: mongo:6.0
    depends_on:
      mongodb:
        condition: service_started
    command: >
      bash -c "
        echo 'Waiting for MongoDB to start...'
        sleep 5
        echo 'Initiating replica set...'
        mongosh --host mongodb:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})'
      "

  redis:
    image: redis:7-alpine
    container_name: gharse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gharse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/gharse?replicaSet=rs0
      - REDIS_URI=redis://redis:6379/0
      - JWT_SECRET=production_secret_key_change_in_env
      - PORT=5000
      - CLIENT_URL=http://localhost
      - DEFAULT_COMMISSION_PERCENT=15
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gharse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
